id: pipeline
namespace: company.team

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: green

  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020", "2021"]
    defaults: "2019"

  - id: month
    type: SELECT
    displayName: Select month
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    defaults: "01"

variables:
  file: "{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}.csv"
  staging_table: "public.{{inputs.taxi}}_tripdata_staging"
  table: "public.{{inputs.taxi}}_tripdata"
  data: "{{outputs.extract.outputFiles[inputs.taxi ~ '_tripdata_' ~ inputs.year ~ '-' ~ inputs.month ~ '.csv']}}"

tasks:
  - id: hello
    type: io.kestra.plugin.core.log.Log
    message: Hello World! 🚀

  - id: set_label
    type: io.kestra.plugin.core.execution.Labels
    labels:
      file: "{{render(vars.file)}}"
      taxi: "{{inputs.taxi}}"

  - id: export
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "{{render(toRender=vars.file, recursive=true)}}"

  - id: extract
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "*.csv"
    taskCache:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - wget -qO- https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi}}/{{render(vars.file)}}.gz | gunzip > {{render(vars.file)}}

  - id: if_green
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'green'}}"
    then:
      - id: create_green_table
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          CREATE TABLE IF NOT EXISTS {{render(toRender=vars.table, recursive=true)}} (
            unique_row_id text,
            filename text,
            VendorID bigint,
            lpep_pickup_datetime timestamp without time zone,
            lpep_dropoff_datetime timestamp without time zone,
            store_and_fwd_flag text COLLATE pg_catalog."default",
            RatecodeID bigint,
            PULocationID bigint,
            DOLocationID bigint,
            passenger_count bigint,
            trip_distance double precision,
            fare_amount double precision,
            extra double precision,
            mta_tax double precision,
            tip_amount double precision,
            tolls_amount double precision,
            ehail_fee double precision,
            improvement_surcharge double precision,
            total_amount double precision,
            payment_type bigint,
            trip_type bigint,
            congestion_surcharge double precision
          );

      - id: create_green_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          CREATE TABLE IF NOT EXISTS {{render(toRender=vars.staging_table, recursive=true)}} (
            unique_row_id text,
            filename text,
            VendorID bigint,
            lpep_pickup_datetime timestamp without time zone,
            lpep_dropoff_datetime timestamp without time zone,
            store_and_fwd_flag text COLLATE pg_catalog."default",
            RatecodeID bigint,
            PULocationID bigint,
            DOLocationID bigint,
            passenger_count bigint,
            trip_distance double precision,
            fare_amount double precision,
            extra double precision,
            mta_tax double precision,
            tip_amount double precision,
            tolls_amount double precision,
            ehail_fee double precision,
            improvement_surcharge double precision,
            total_amount double precision,
            payment_type bigint,
            trip_type bigint,
            congestion_surcharge double precision
          );

      - id: truncate_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          TRUNCATE TABLE {{render(toRender=vars.staging_table, recursive=true)}}

      - id: green_copy_into_staging_table
        type: io.kestra.plugin.jdbc.postgresql.CopyIn
        format: CSV
        from: "{{render(toRender=vars.data, recursive=true)}}"
        table: "{{render(toRender=vars.staging_table, recursive=true)}}"
        header: true
        columns: [VendorID,lpep_pickup_datetime,lpep_dropoff_datetime,store_and_fwd_flag,RatecodeID,PULocationID,DOLocationID,passenger_count,trip_distance,fare_amount,extra,mta_tax,tip_amount,tolls_amount,ehail_fee,improvement_surcharge,total_amount,payment_type,trip_type,congestion_surcharge]

      - id: green_add_unique_id_and_filename
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          UPDATE {{render(toRender=vars.staging_table, recursive=true)}}
          SET unique_row_id = md5(
            COALESCE(CAST(VendorID as text), '') ||
            COALESCE(CAST(lpep_pickup_datetime as text), '') ||
            COALESCE(CAST(lpep_dropoff_datetime as text), '') ||
            COALESCE(CAST(PULocationID as text), '') ||
            COALESCE(CAST(DOLocationID as text), '') ||
            COALESCE(CAST(fare_amount as text), '') ||
            COALESCE(CAST(trip_distance as text), '')
          ),
          filename = '{{render(toRender=vars.file, recursive=true)}}';

      - id: green_merge_data
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          MERGE INTO {{render(toRender=vars.table, recursive=true)}} AS T
          USING {{render(toRender=vars.staging_table, recursive=true)}} AS S
          ON T.unique_row_id = S.unique_row_id
          WHEN NOT MATCHED THEN
            INSERT (
              unique_row_id, filename, VendorID,lpep_pickup_datetime,lpep_dropoff_datetime,store_and_fwd_flag,RatecodeID,PULocationID,DOLocationID,passenger_count,trip_distance,fare_amount,extra,mta_tax,tip_amount,tolls_amount,ehail_fee,improvement_surcharge,total_amount,payment_type,trip_type,congestion_surcharge
            )
            VALUES (
              S.unique_row_id, S.filename, S.VendorID, S.lpep_pickup_datetime, S.lpep_dropoff_datetime, S.store_and_fwd_flag, S.RatecodeID, S.PULocationID, S.DOLocationID, S.passenger_count, S.trip_distance, S.fare_amount, S.extra, S.mta_tax, S.tip_amount, S.tolls_amount, S.ehail_fee, S.improvement_surcharge, S.total_amount, S.payment_type, S.trip_type, S.congestion_surcharge
            )

  - id: if_yellow
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'yellow'}}"
    then: 
      - id: create_yellow_table
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          CREATE TABLE IF NOT EXISTS {{render(toRender=vars.table, recursive=true)}} (
            unique_row_id text,
            filename text,
            VendorID bigint,
            tpep_pickup_datetime timestamp without time zone,
            tpep_dropoff_datetime timestamp without time zone,
            passenger_count bigint,
            trip_distance double precision,
            RatecodeID bigint,
            store_and_fwd_flag text COLLATE pg_catalog."default",
            PULocationID bigint,
            DOLocationID bigint,
            payment_type bigint,
            fare_amount double precision,
            extra double precision,
            mta_tax double precision,
            tip_amount double precision,
            tolls_amount double precision,
            improvement_surcharge double precision,
            total_amount double precision,
            congestion_surcharge double precision
          );

      - id: create_yellow_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          CREATE TABLE IF NOT EXISTS {{render(toRender=vars.staging_table, recursive=true)}} (
            unique_row_id text,
            filename text,
            VendorID bigint,
            tpep_pickup_datetime timestamp without time zone,
            tpep_dropoff_datetime timestamp without time zone,
            passenger_count bigint,
            trip_distance double precision,
            RatecodeID bigint,
            store_and_fwd_flag text COLLATE pg_catalog."default",
            PULocationID bigint,
            DOLocationID bigint,
            payment_type bigint,
            fare_amount double precision,
            extra double precision,
            mta_tax double precision,
            tip_amount double precision,
            tolls_amount double precision,
            improvement_surcharge double precision,
            total_amount double precision,
            congestion_surcharge double precision
          );

      - id: yellow_truncate_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          TRUNCATE TABLE {{render(toRender=vars.staging_table, recursive=true)}}

      - id: yellow_copy_into_staging_table
        type: io.kestra.plugin.jdbc.postgresql.CopyIn
        format: CSV
        from: "{{render(toRender=vars.data, recursive=true)}}"
        table: "{{render(toRender=vars.staging_table, recursive=true)}}"
        header: true
        columns: [VendorID,tpep_pickup_datetime,tpep_dropoff_datetime,passenger_count,trip_distance,RatecodeID,store_and_fwd_flag,PULocationID,DOLocationID,payment_type,fare_amount,extra,mta_tax,tip_amount,tolls_amount,improvement_surcharge,total_amount,congestion_surcharge]

      - id: yellow_add_unique_id_and_filename
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          UPDATE {{render(toRender=vars.staging_table, recursive=true)}}
          SET unique_row_id = md5(
            COALESCE(CAST(VendorID as text), '') ||
            COALESCE(CAST(tpep_pickup_datetime as text), '') ||
            COALESCE(CAST(tpep_dropoff_datetime as text), '') ||
            COALESCE(CAST(PULocationID as text), '') ||
            COALESCE(CAST(DOLocationID as text), '') ||
            COALESCE(CAST(fare_amount as text), '') ||
            COALESCE(CAST(trip_distance as text), '')
          ),
          filename = '{{render(toRender=vars.file, recursive=true)}}';

      - id: yellow_merge_data
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          MERGE INTO {{render(toRender=vars.table, recursive=true)}} AS T
          USING {{render(toRender=vars.staging_table, recursive=true)}} AS S
          ON T.unique_row_id = S.unique_row_id
          WHEN NOT MATCHED THEN
            INSERT (
              unique_row_id, filename, VendorID, tpep_pickup_datetime, tpep_dropoff_datetime, passenger_count, trip_distance, RatecodeID, store_and_fwd_flag, PULocationID, DOLocationID, payment_type, fare_amount, extra, mta_tax, tip_amount, tolls_amount, improvement_surcharge, total_amount, congestion_surcharge
            )
            VALUES (
              S.unique_row_id, S.filename, S.VendorID, S.tpep_pickup_datetime, S.tpep_dropoff_datetime, S.passenger_count, S.trip_distance, S.RatecodeID, S.store_and_fwd_flag, S.PULocationID, S.DOLocationID, S.payment_type, S.fare_amount, S.extra, S.mta_tax, S.tip_amount, S.tolls_amount, S.improvement_surcharge, S.total_amount, S.congestion_surcharge
            )

  - id: purge_file
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: "This will delete all the generated files from a flow for the current execution. This will delete all files from: inputs, outputs, triggers. If the current execution doesn’t have any generated files, the task will not fail."


pluginDefaults:
  - type: io.kestra.plugin.jdbc.postgresql
    values:
      url: jdbc:postgresql://pgdatabase:5432/ny_taxi
      username: root
      password: root